<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mes congés 12h08</title>
<style>
:root{--bg:#eef3fb;--card:#fff;--ink:#0f1b3d;--mut:#6b7794;--bar:#14264f;--line:#e3e9f5;--rest:#eaf1ff;--ok:#10b981;--red:#e5484d;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1426;--card:#15203a;--ink:#e8edf9;--mut:#93a0bf;--line:#26345a;--rest:#1b2a4d}}
:root[data-theme="dark"]{--bg:#0c1426;--card:#15203a;--ink:#e8edf9;--mut:#93a0bf;--line:#26345a;--rest:#1b2a4d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--bar);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px}
header b{font-size:20px;letter-spacing:.5px;display:block}header small{opacity:.8;font-size:12px}
.flag{width:34px;height:24px;border-radius:3px;background:linear-gradient(90deg,#1d3fa8 33%,#fff 33% 66%,#e5303a 66%)}
main{max-width:560px;margin:0 auto;padding:14px}
.card{background:var(--card);border-radius:16px;padding:14px;box-shadow:0 2px 10px rgba(20,38,79,.08);margin-bottom:14px}
.row{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:4px}
.cnt{flex:0 0 118px;scroll-snap-align:start;text-align:center;cursor:pointer;padding:4px 0}
.cnt svg{width:96px;height:96px}
.cnt .v{font-size:14px;font-weight:700;margin-top:-62px;height:30px;display:flex;align-items:center;justify-content:center}
.cnt .n{font-size:13px;margin-top:2px;height:30px}
.cnt .s{font-size:11px;color:var(--mut);margin-top:10px}
.add{flex:0 0 90px;display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:34px;cursor:pointer}
.neg{color:var(--red)}
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.nav h2{margin:0;font-size:18px}.nav .m{font-size:15px}
button{font:inherit;cursor:pointer}
.ib{background:var(--rest);color:var(--ink);border:0;border-radius:8px;width:40px;height:34px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.dn{text-align:center;color:var(--mut);font-size:12px;padding:4px 0}
.d{aspect-ratio:1/.85;border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:15px;background:var(--card);cursor:pointer;position:relative}
.d.rest{background:var(--rest);color:#3b6fe0}.d.out{opacity:.4}
.d.today{outline:2px solid #3b6fe0}
.dot{width:7px;height:7px;border-radius:50%;margin-top:3px;background:transparent}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--mut);margin-top:12px}
.leg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
.cyc{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--mut);flex-wrap:wrap}
input,select{font:inherit;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);width:100%}
.bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:9}
.bg.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:85%;overflow:auto}
.sheet h3{margin:0 0 12px}
.btn{display:block;width:100%;padding:12px;border-radius:10px;border:0;margin-top:8px;background:#2f6bf0;color:#fff;font-weight:600}
.btn.alt{background:var(--rest);color:var(--ink)}.btn.del{background:var(--red)}
.two{display:flex;gap:8px}.lab{font-size:12px;color:var(--mut);margin:10px 0 4px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:0;border-radius:20px;padding:9px 14px;color:#fff;font-weight:600}
</style>
</head>
<body>
<header><div class="flag"></div><div><b>GESTT</b><small>Gestion du temps de travail · 12h08</small></div></header>
<main>
<div class="card"><div class="row" id="cnts"></div></div>
<div class="card">
<div class="nav"><h2>📅 Calendrier</h2><div style="display:flex;gap:6px;align-items:center"><button class="ib" id="pv">‹</button><span class="m" id="mt"></span><button class="ib" id="nx">›</button></div></div>
<div class="grid" id="g"></div>
<div class="leg" id="lg"></div>
</div>
<div class="card cyc"><span>Cycle 2-2-3 · 1er jour du bloc de 2 jours de travail :</span><input type="date" id="st" style="max-width:170px"></div>
</main>
<div class="bg" id="bg"><div class="sheet" id="sh"></div></div>
<script>
var MIN=728,PAT=[1,1,0,0,1,1,1,0,0,1,1,0,0,0];
var COL=['#3b82f6','#e11d48','#8b5cf6','#f59e0b','#ec4899','#475569','#78350f','#a16207','#06b6d4','#f97316'];
var H='RTC,CF,CME,DIF,C16,HS,HSE,HST,RCH,RCR,REX,RPS'.split(','),
J='RTT,CAA,CA,HPA,HP,CAM,CET,DJR,ET,C08,BON,D16,JNT,RCB'.split(',');
var S={start:'',counters:[],posed:{}};
try{var r=localStorage.getItem('gestt12h08');if(r)S=JSON.parse(r)}catch(e){}
if(!S.counters.length){
 ['RTT','RTC','CAA','CA','HPA','HP','CAM','CET','CF','CME','DJR','DIF','ET','C08','BON','C16','D16','HS','HSE','HST','RCH','RCR','REX','RPS','JNT','RCB'].forEach(function(n,i){
  S.counters.push({id:'c'+i,name:n,unit:H.indexOf(n)>=0?'h':'j',bal:0,init:0})})}
function save(){try{localStorage.setItem('gestt12h08',JSON.stringify(S))}catch(e){}}
function $(i){return document.getElementById(i)}
function p2(n){return(n<10?'0':'')+n}
function fmt(c,v){if(c.unit==='j')return(Math.round(v*100)/100)+'j';var s=v<0?'-':'';v=Math.abs(v);return s+Math.floor(v/60)+'h'+p2(v%60)+'m'}
function cost(c){return c.unit==='j'?1:MIN}
function col(c){return COL[S.counters.indexOf(c)%COL.length]}
function byId(id){return S.counters.filter(function(c){return c.id===id})[0]}
function dn(s){var a=s.split('-');return Math.floor(Date.UTC(+a[0],+a[1]-1,+a[2])/864e5)}
function key(y,m,d){return y+'-'+p2(m+1)+'-'+p2(d)}
function work(k){if(!S.start)return null;var x=((dn(k)-dn(S.start))%14+14)%14;return PAT[x]===1}
var now=new Date(),cy=now.getFullYear(),cm=now.getMonth(),tk=key(cy,cm,now.getDate());
function renderC(){
 var h='';S.counters.forEach(function(c,i){
  var f=c.init>0?Math.max(0,Math.min(1,c.bal/c.init)):0,R=42,L=2*Math.PI*R,col=COL[i%COL.length];
  h+='<div class="cnt" data-i="'+i+'"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="'+R+'" fill="none" stroke="'+col+'" stroke-opacity=".18" stroke-width="7"/><circle cx="50" cy="50" r="'+R+'" fill="none" stroke="'+col+'" stroke-width="7" stroke-linecap="round" stroke-dasharray="'+(L*f)+' '+L+'" transform="rotate(-90 50 50)"/></svg>'+
  '<div class="v'+(c.bal<0?' neg':'')+'">'+fmt(c,c.bal)+'</div><div class="n">'+c.name+'</div><div class="s">posé : '+fmt(c,Math.max(0,c.init-c.bal))+'</div></div>'});
 h+='<div class="add" id="ad">＋</div>';$('cnts').innerHTML=h;
 $('cnts').querySelectorAll('.cnt').forEach(function(e){e.onclick=function(){editC(+e.dataset.i)}});$('ad').onclick=function(){editC(-1)};
 var l='<span><i style="background:'+'#10b981'+'"></i>Présent</span><span><i style="background:var(--rest);border:1px solid #3b6fe0"></i>Repos</span>';
 S.counters.forEach(function(c){if(Object.values(S.posed).indexOf(c.id)>=0)l+='<span><i style="background:'+col(c)+'"></i>'+c.name+'</span>'});
 $('lg').innerHTML=l}
function renderCal(){
 var M=['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
 $('mt').textContent=M[cm]+' '+cy;var h='';'Lun,Mar,Mer,Jeu,Ven,Sam,Dim'.split(',').forEach(function(d){h+='<div class="dn">'+d+'</div>'});
 var f=(new Date(cy,cm,1).getDay()+6)%7,n=new Date(cy,cm+1,0).getDate(),pm=new Date(cy,cm,0).getDate();
 for(var i=0;i<f;i++)h+='<div class="d out">'+(pm-f+1+i)+'</div>';
 for(var d=1;d<=n;d++){var k=key(cy,cm,d),w=work(k),ps=S.posed[k],c=ps?byId(ps):null,cl='d'+(w===false?' rest':'')+(k===tk?' today':'');
  var dot=c?'transparent':(w?'#10b981':'transparent'),st=c?' style="background:'+col(c)+';border-color:'+col(c)+';color:#fff;font-weight:700"':'';
  h+='<div class="'+cl+'" data-k="'+k+'"'+st+'>'+d+'<span class="dot" style="background:'+dot+'"></span></div>'}
 var t=(f+n)%7;if(t)for(i=1;i<=7-t;i++)h+='<div class="d out">'+i+'</div>';
 $('g').innerHTML=h;$('g').querySelectorAll('.d[data-k]').forEach(function(e){e.onclick=function(){dayM(e.dataset.k)}})}
function open(h){$('sh').innerHTML=h;$('bg').classList.add('on')}
function close(){$('bg').classList.remove('on')}
$('bg').onclick=function(e){if(e.target===$('bg'))close()};
function all(){save();renderC();renderCal()}
function dayM(k){
 var w=work(k),ps=S.posed[k],c=ps?byId(ps):null,t=k.split('-').reverse().join('/');
 if(w===null){open('<h3>'+t+'</h3><p>Renseigne d’abord le 1er jour de ton cycle en bas de page.</p><button class="btn alt" onclick="close()">OK</button>');return}
 if(c){open('<h3>'+t+'</h3><p>Posé en <b>'+c.name+'</b> ('+fmt(c,cost(c))+').</p><button class="btn del" id="un">Annuler la pose (rend '+fmt(c,cost(c))+')</button><button class="btn alt" onclick="close()">Fermer</button>');
  $('un').onclick=function(){c.bal+=cost(c);delete S.posed[k];close();all()};return}
 if(!w){open('<h3>'+t+'</h3><p>Jour de repos dans ton cycle.</p><button class="btn alt" onclick="close()">Fermer</button>');return}
 var h='<h3>Poser le '+t+'</h3><p style="color:var(--mut);font-size:13px;margin-top:-6px">Nuit de travail = 12h08 (ou 1 jour pour un compteur en jours)</p><div class="chips">';
 S.counters.forEach(function(x,i){h+='<button class="chip" style="background:'+col(x)+'" data-i="'+i+'">'+x.name+' · '+fmt(x,x.bal)+'</button>'});
 open(h+'</div><button class="btn alt" onclick="close()">Annuler</button>');
 $('sh').querySelectorAll('.chip').forEach(function(e){e.onclick=function(){var x=S.counters[+e.dataset.i];x.bal-=cost(x);S.posed[k]=x.id;close();all()}})}
function editC(i){
 var c=i<0?{name:'',unit:'h',bal:0,init:0}:S.counters[i],v=Math.abs(c.bal),neg=c.bal<0;
 var h='<h3>'+(i<0?'Nouveau compteur':'Compteur '+c.name)+'</h3>';
 if(i<0)h+='<div class="lab">Nom</div><input id="en" placeholder="ex. CA"><div class="lab">Unité</div><select id="eu"><option value="h">Heures (h/m)</option><option value="j">Jours</option></select>';
 h+='<div class="lab">Solde actuel (à saisir à la main)</div><div class="two" id="ev"></div>';
 open(h+'<button class="btn" id="ok">Enregistrer</button>'+(i>=0?'<button class="btn del" id="rm">Supprimer ce compteur</button>':'')+'<button class="btn alt" onclick="close()">Annuler</button>');
 function fields(u){$('ev').innerHTML=u==='h'?'<input id="e1" type="number" min="0" placeholder="heures" value="'+Math.floor(v/60)+'"><input id="e2" type="number" min="0" max="59" placeholder="minutes" value="'+(v%60)+'">':'<input id="e1" type="number" step="0.5" min="0" placeholder="jours" value="'+v+'">'}
 fields(c.unit);if(i<0)$('eu').onchange=function(){fields($('eu').value)};
 $('ok').onclick=function(){
  var u=i<0?$('eu').value:c.unit,nv=u==='h'?(+$('e1').value||0)*60+(+$('e2').value||0):(+$('e1').value||0);
  if(neg&&i>=0&&nv===0)nv=0;
  if(i<0){var nm=($('en').value||'').trim().toUpperCase();if(!nm)return;S.counters.push({id:'c'+Date.now(),name:nm,unit:u,bal:nv,init:nv})}
  else{c.bal=nv;c.init=nv}
  close();all()};
 if(i>=0)$('rm').onclick=function(){S.counters.splice(i,1);Object.keys(S.posed).forEach(function(k){if(S.posed[k]===c.id)delete S.posed[k]});close();all()}}
$('pv').onclick=function(){cm--;if(cm<0){cm=11;cy--}renderCal()};
$('nx').onclick=function(){cm++;if(cm>11){cm=0;cy++}renderCal()};
$('st').value=S.start;$('st').onchange=function(){S.start=this.value;all()};
all();
</script>
</body>
</html>
